# dsh-plugin-chaos bundle patch.
#
# The web-app bundle already inserts chaos-mobile, chaos-auth, chaos-restart,
# chaos-models, chaos-retry, and process-control. This bundle adds the
# optional think-tag renderer and the archived-session retention sweeper.
- insert:
    - id: chaos-think-tags
      name: '@deepseek-ai/dsh-plugin-chaos-think-tags'

    - id: chaos-janitor
      name: '@deepseek-ai/dsh-plugin-chaos-janitor'
      config:
        # Retention: 0 disables the sweeper; a positive value deletes an
        # archived session once its log has been quiet this many days.
        maxArchivedDays: 0
        intervalMinutes: 60
        dryRun: false
